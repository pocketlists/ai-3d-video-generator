name: 01 - Receive Request

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video generation prompt'
        required: true
        default: 'A serene low-poly landscape at sunrise'
  repository_dispatch:
    types: [generate-video]

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  PYTHONPATH: ${{ github.workspace }}

jobs:
  receive-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Receive and store request
        env:
          PROMPT: ${{ github.event.inputs.prompt || github.event.client_payload.prompt || 'A serene low-poly landscape at sunrise' }}
        run: |
          python -c "
          import json, os
          prompt = os.environ.get('PROMPT', 'A serene low-poly landscape at sunrise')
          config = {'prompt': prompt, 'source': 'github_actions', 'run_id': os.environ.get('GITHUB_RUN_ID', 'unknown')}
          with open(os.environ['ARTIFACT_DIR'] + '/video_plan.json', 'w') as f:
              json.dump({'prompt': prompt, 'title': f'Low-poly video: {prompt[:50]}', 'scenes': [], 'estimated_duration': 60, 'fps': 24, 'total_frames': 1440}, f, indent=2)
          print(f'Request received: {prompt}')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-request
          path: /tmp/pipeline_artifacts/
          retention-days: 7

      - name: Trigger planning workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 02_ai_planning.yml \
            -f prompt="${{ github.event.inputs.prompt || 'A serene low-poly landscape at sunrise' }}"
        continue-on-error: true
