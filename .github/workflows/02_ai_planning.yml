name: 02 - AI Planning

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video prompt'
        required: false
        default: 'A serene low-poly landscape at sunrise'

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ai-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Download request artifact
        uses: actions/download-artifact@v4
        with:
          name: pipeline-request
          path: ${{ env.ARTIFACT_DIR }}
        continue-on-error: true

      - name: Run AI planning
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python -m controller.orchestrator --stage ai_planning

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-plan
          path: /tmp/pipeline_artifacts/
          retention-days: 7

      - name: Trigger script breakdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 03_script_breakdown.yml
        continue-on-error: true
