name: 07 - Props

on:
  workflow_dispatch:

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  PYTHONPATH: ${{ github.workspace }}

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Download previous artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-plan
          path: ${{ env.ARTIFACT_DIR }}
        continue-on-error: true

      - name: Run Props
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          
        run: |
          python -m controller.orchestrator --stage props

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-props
          path: /tmp/pipeline_artifacts/
          retention-days: 7

      - name: Trigger next workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 08_animation.yml
        continue-on-error: true
