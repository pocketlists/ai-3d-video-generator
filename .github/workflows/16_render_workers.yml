name: 16 - Render Workers (Parallel)

on:
  workflow_dispatch:
    inputs:
      num_workers:
        description: 'Number of render workers'
        required: false
        default: '4'
      frame_start:
        description: 'Start frame'
        required: false
        default: '1'
      frame_end:
        description: 'End frame'
        required: false
        default: '1440'

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Download previous artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-blender-assembly
          path: ${{ env.ARTIFACT_DIR }}
        continue-on-error: true

      - name: Generate render task matrix
        id: set-matrix
        run: |
          python -c "
          import json, math
          num_workers = int('${{ github.event.inputs.num_workers || 4 }}')
          frame_start = int('${{ github.event.inputs.frame_start || 1 }}')
          frame_end = int('${{ github.event.inputs.frame_end || 1440 }}')
          total = frame_end - frame_start + 1
          per_worker = math.ceil(total / num_workers)
          workers = []
          for i in range(num_workers):
              s = frame_start + i * per_worker
              e = min(s + per_worker - 1, frame_end)
              if s <= e:
                  workers.append({'worker_id': i, 'frame_start': s, 'frame_end': e})
          print(f'matrix={json.dumps({"include": workers})}')
          with open('/tmp/matrix.json', 'w') as f:
              f.write(json.dumps({'include': workers}))
          "
          echo "matrix=$(cat /tmp/matrix.json)" >> $GITHUB_OUTPUT

      - name: Upload scene for workers
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-render-prep
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Download scene artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-render-prep
          path: ${{ env.ARTIFACT_DIR }}
        continue-on-error: true

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version || true

      - name: Render frames (Worker ${{ matrix.worker_id }})
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          FRAME_START: ${{ matrix.frame_start }}
          FRAME_END: ${{ matrix.frame_end }}
          RENDER_SAMPLES: '64'
          RENDER_ENGINE: BLENDER_EEVEE
          RESOLUTION: 1280x720
          BLENDER_PATH: blender
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python -m controller.orchestrator --stage render_workers

      - name: Upload render output (Worker ${{ matrix.worker_id }})
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-render-worker-${{ matrix.worker_id }}
          path: /tmp/pipeline_artifacts/renders/worker_${{ matrix.worker_id }}/
          retention-days: 7
        if: always()

  collect:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR/renders

      - name: Download all worker renders
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-render-worker-*
          path: ${{ env.ARTIFACT_DIR }}/renders/
          merge-multiple: true
        continue-on-error: true

      - name: Reorganize renders
        run: |
          cd $ARTIFACT_DIR/renders
          mkdir -p worker_0
          mv frame_*.png worker_0/ 2>/dev/null || true
          echo "Collected frames:"
          find . -name "*.png" | wc -l

      - name: Upload collected renders
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-renders-collected
          path: /tmp/pipeline_artifacts/renders/
          retention-days: 7

      - name: Trigger quality check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 17_quality_check.yml
        continue-on-error: true
