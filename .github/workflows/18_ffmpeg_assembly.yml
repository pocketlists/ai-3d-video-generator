name: 18 - FFmpeg Assembly

on:
  workflow_dispatch:

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ffmpeg-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Download renders
        uses: actions/download-artifact@v4
        with:
          name: pipeline-renders-collected
          path: ${{ env.ARTIFACT_DIR }}/renders/
        continue-on-error: true

      - name: Download audio artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-*
          path: ${{ env.ARTIFACT_DIR }}/
          merge-multiple: true
        continue-on-error: true

      - name: Run FFmpeg assembly
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python -m controller.orchestrator --stage ffmpeg_assembly

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-final-video
          path: /tmp/pipeline_artifacts/output/
          retention-days: 14

      - name: Trigger delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 19_telegram_delivery.yml
        continue-on-error: true

      - name: Trigger optimization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 20_self_optimize.yml
        continue-on-error: true
