name: 20 - Self Optimize

on:
  workflow_dispatch:

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  PYTHONPATH: ${{ github.workspace }}

jobs:
  self-optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p $ARTIFACT_DIR $METRICS_DIR

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pipeline-*
          path: ${{ env.ARTIFACT_DIR }}/
          merge-multiple: true
        continue-on-error: true

      - name: Run optimization analysis
        run: |
          python -m controller.orchestrator --stage self_optimize

      - name: Upload optimization results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-optimization
          path: /tmp/pipeline_metrics/
          retention-days: 30
        if: always()

      - name: Display optimization report
        run: |
          cat /tmp/pipeline_metrics/optimization_report.txt 2>/dev/null || echo "No report generated"
