name: AI Video Pipeline (Master)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video generation prompt'
        required: true
        default: 'A serene landscape at sunrise'
      style:
        description: 'Visual style (anime, cinematic, realistic, stylized, fantasy, low-poly)'
        required: false
        default: 'low-poly'
      num_workers:
        description: 'Number of render workers (1-20)'
        required: false
        default: '4'
      quality:
        description: 'Quality profile (draft, standard, high, ultra)'
        required: false
        default: 'standard'

env:
  ARTIFACT_DIR: /tmp/pipeline_artifacts
  METRICS_DIR: /tmp/pipeline_metrics
  STATE_DIR: /tmp/pipeline_state
  LOG_DIR: /tmp/pipeline_logs
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ── STAGE 1: RECEIVE ──
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      job_id: ${{ steps.create.outputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR $STATE_DIR $LOG_DIR
      - name: Receive request
        id: create
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          STYLE: ${{ github.event.inputs.style }}
        run: |
          python -c "
          import json, os, uuid, time
          job_id = 'job_' + time.strftime('%Y%m%d_%H%M%S') + '_' + uuid.uuid4().hex[:6]
          data = {'job_id': job_id, 'prompt': os.environ['PROMPT'], 'style': os.environ['STYLE'],
                  'created_at': time.time(), 'status': 'RECEIVED'}
          with open(os.environ['ARTIFACT_DIR'] + '/request.json', 'w') as f:
              json.dump(data, f, indent=2)
          print(f'::notice::Job ID: {job_id}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'job_id={job_id}\n')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-request
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 2: PLANNING ──
  planning:
    needs: receive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-request
          path: /tmp/pipeline_artifacts/
      - name: Run AI planning
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'template' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python -m controller.orchestrator --stage ai_planning
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-plan
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 3: SCRIPT BREAKDOWN ──
  script:
    needs: planning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-plan
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage script_breakdown
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 4: ASSET COLLECTION ──
  assets:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage asset_collection
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-assets
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGES 5-7: CHARACTERS, ENVIRONMENTS, PROPS (parallel) ──
  characters:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - env:
          THREE_D_ASSET_API_KEY: ${{ secrets.THREE_D_ASSET_API_KEY }}
          THREE_D_ASSET_API_URL: ${{ secrets.THREE_D_ASSET_API_URL }}
        run: python -m controller.orchestrator --stage characters
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-characters
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  environments:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - env:
          THREE_D_ASSET_API_KEY: ${{ secrets.THREE_D_ASSET_API_KEY }}
          THREE_D_ASSET_API_URL: ${{ secrets.THREE_D_ASSET_API_URL }}
        run: python -m controller.orchestrator --stage environments
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-environments
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  props:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - env:
          THREE_D_ASSET_API_KEY: ${{ secrets.THREE_D_ASSET_API_KEY }}
          THREE_D_ASSET_API_URL: ${{ secrets.THREE_D_ASSET_API_URL }}
        run: python -m controller.orchestrator --stage props
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-props
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGES 11-13: VOICE, MUSIC, SFX (parallel with assets) ──
  voice_tts:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE || 'Kore' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'gemini_tts' }}
        run: python -m controller.orchestrator --stage voice_tts
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-voice
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  music:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage music
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-music
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  sfx:
    needs: script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-script
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage sfx
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-sfx
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 8: ANIMATION (needs characters+env+props) ──
  animation:
    needs: [characters, environments, props]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-characters
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-environments
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-props
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage animation
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-animation
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 9: CAMERA ──
  camera:
    needs: environments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-environments
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage camera
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-camera
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 10: LIGHTING ──
  lighting:
    needs: environments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-environments
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage lighting
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-lighting
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 14: LIP SYNC ──
  lip_sync:
    needs: [voice_tts, characters]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-voice
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-characters
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage lip_sync
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-lipsync
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 15: BLENDER ASSEMBLY ──
  assembly:
    needs: [animation, camera, lighting, lip_sync]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-animation
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-camera
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-lighting
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-lipsync
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage blender_assembly
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-assembly
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 15.5: RENDER PREPARE (compute dynamic worker matrix) ──
  render_prepare:
    needs: assembly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      num_workers: ${{ steps.compute.outputs.num_workers }}
      total_frames: ${{ steps.compute.outputs.total_frames }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute worker matrix
        id: compute
        env:
          REQUESTED_WORKERS: ${{ github.event.inputs.num_workers }}
        run: |
          python -c "
          import json, os
          requested = int(os.environ.get('REQUESTED_WORKERS', '4') or '4')
          actual = min(max(1, requested), 20)
          matrix = [i for i in range(actual)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps(matrix)}\n')
              f.write(f'num_workers={actual}\n')
              f.write(f'total_frames=1440\n')
          print(f'REQUESTED_WORKERS={requested}')
          print(f'MATRIX_WORKERS={actual}')
          "

  # ── STAGE 16: RENDER (dynamic parallel matrix) ──
  render:
    needs: [assembly, render_prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        worker_id: ${{ fromJSON(needs.render_prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-assembly
          path: /tmp/pipeline_artifacts/
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb libgl1 libegl1 libglx-mesa0
      - name: Verify Blender installation
        run: |
          blender --version || { echo "ERROR: Blender is required for production render and is not available"; exit 1; }
      - name: Render (Worker ${{ matrix.worker_id }})
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          NUM_WORKERS: ${{ needs.render_prepare.outputs.num_workers }}
          TOTAL_FRAMES: ${{ needs.render_prepare.outputs.total_frames }}
          RENDER_ENGINE: BLENDER_EEVEE
          PIPELINE_MODE: production
        run: |
          export FRAME_START=$((WORKER_ID * TOTAL_FRAMES / NUM_WORKERS + 1))
          export FRAME_END=$(((WORKER_ID + 1) * TOTAL_FRAMES / NUM_WORKERS))
          echo "WORKER_ID=$WORKER_ID FRAME_START=$FRAME_START FRAME_END=$FRAME_END"
          python -m controller.orchestrator --stage render_workers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-render-${{ matrix.worker_id }}
          path: /tmp/pipeline_artifacts/renders/worker_${{ matrix.worker_id }}/
          retention-days: 7

  # ── STAGE 17: QUALITY CHECK ──
  quality:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          pattern: pipeline-render-*
          path: /tmp/pipeline_artifacts/renders/
          merge-multiple: true
      - name: Worker status report (truth)
        run: |
          python -c "
          import json, os
          renders = os.environ.get('ARTIFACT_DIR', '/tmp/pipeline_artifacts') + '/renders'
          mf = os.path.join(renders, 'render_manifest.json')
          if os.path.exists(mf):
              with open(mf) as f:
                  m = json.load(f)
              statuses = m.get('worker_status', {})
              completed = sum(1 for s in statuses.values() if str(s).startswith('success'))
              failed = sum(1 for s in statuses.values() if s == 'error')
              print(f'REQUESTED_WORKERS={m.get("requested_workers", "unknown")}')
              print(f'ACTUAL_MATRIX_WORKERS={m.get("actual_workers", "unknown")}')
              print(f'ACTIVE_WORKERS={len(statuses)}')
              print(f'COMPLETED_WORKERS={completed}')
              print(f'FAILED_WORKERS={failed}')
              print(f'FRAMES: {m.get("actual_frames", "?")}/{m.get("expected_frames", "?")}')
          else:
              print('render_manifest.json not found')
          "
      - run: python -m controller.orchestrator --stage quality_check
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-quality
          path: /tmp/pipeline_artifacts/
          retention-days: 7

  # ── STAGE 18: FFMPEG ASSEMBLY ──
  ffmpeg:
    needs: [quality, voice_tts, music, sfx]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-quality
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-voice
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-music
          path: /tmp/pipeline_artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-sfx
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage ffmpeg_assembly
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-final
          path: /tmp/pipeline_artifacts/output/
          retention-days: 14

  # ── STAGE 19: TELEGRAM DELIVERY ──
  delivery:
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-final
          path: /tmp/pipeline_artifacts/output/
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m controller.orchestrator --stage telegram_delivery

  # ── STAGE 20: SELF-OPTIMIZE ──
  optimize:
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && mkdir -p $ARTIFACT_DIR $METRICS_DIR
      - uses: actions/download-artifact@v4
        with:
          name: pipeline-quality
          path: /tmp/pipeline_artifacts/
      - run: python -m controller.orchestrator --stage self_optimize
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-optimization
          path: /tmp/pipeline_metrics/
          retention-days: 30
