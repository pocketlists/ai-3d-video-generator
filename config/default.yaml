# AI 3D Video Generator — Default Configuration (v3.0)
# Secrets MUST be in environment variables or GitHub Secrets, NOT here.

# Pipeline mode: production | test
# production: no placeholder frames, no template LLM fallback, no procedural assets
# test: smoke tests, procedural allowed, placeholders allowed
pipeline_mode: test

# Pipeline settings
pipeline:
  name: "ai-3d-video-generator"
  version: "3.0.0"
  target_duration_sec: 60
  fps: 24
  total_frames: 1440

# LLM Provider (gemini, openai, template)
# DO NOT silently fallback to template if gemini fails — escalate instead
llm_provider: template
gemini_model: gemini-2.5-flash
openai_model: gpt-4o-mini
allow_template_fallback: false

# Asset Provider
asset_provider: objaverse
objaverse_enabled: false
three_d_asset_api_url: ""
asset_cache_dir: assets
asset_routing_order:
  - cache
  - objaverse
  - external_api

# Asset quality classes (PHASE 21)
asset_quality_classes:
  background:
    max_vertices: 500
  prop_low:
    max_vertices: 1000
  prop_medium:
    max_vertices: 3000
  character:
    max_vertices: 10000
  hero_character:
    max_vertices: 50000
  hero_closeup:
    max_vertices: 100000

# TTS Provider (gemini_tts, google_cloud, gtts, elevenlabs)
tts_provider: gtts
tts_mode: free
tts_language: en
tts_voice: ""
tts_speaking_rate: 1.0
tts_pitch: 0.0

# Video settings
video:
  resolution: [1280, 720]
  format: mp4
  codec: libx264
  bitrate: "2M"
  pixel_format: yuv420p

# Render settings
render:
  engine: BLENDER_EEVEE
  samples: 64
  max_workers: 20
  default_workers: 4
  resolution: [1280, 720]
  output_format: PNG

# Quality profiles (PHASE 68)
quality_profiles:
  draft:
    samples: 32
    resolution: [960, 540]
    render_engine: BLENDER_EEVEE
  standard:
    samples: 64
    resolution: [1280, 720]
    render_engine: BLENDER_EEVEE
  high:
    samples: 128
    resolution: [1920, 1080]
    render_engine: BLENDER_EEVEE
  ultra:
    samples: 256
    resolution: [1920, 1080]
    render_engine: CYCLES

# Audio settings
audio:
  sample_rate: 44100
  channels: 2
  voice_volume: 0.8
  music_volume: 0.3
  sfx_volume: 0.4
  music_ducking: true
  normalization: true

# Telegram settings
telegram:
  enabled: true
  send_progress: true
  send_assets: true
  send_final_video: true
  send_error_reports: true

# Escalation settings — NO timeout for human intervention
escalation:
  enabled: true
  # No timeout — runner exits and resume happens via new workflow
  exit_runner_on_escalation: true

# State persistence
state_backend: local  # local, artifact, repository

# Optimization settings
optimization:
  enabled: true
  min_quality_score: 85
  learn_from_history: true
  history_limit: 20

# Failure recovery
failure_recovery:
  max_retries: 3
  retry_delay_sec: 5
  continue_on_partial_failure: true
  validate_before_dependency: true
  escalate_to_telegram: true

# Security
telegram_allowed_user_ids: ""
