# AI 3D Video Generator — Default Configuration
# ===============================================

# Pipeline settings
pipeline:
  name: "ai-3d-video-generator"
  version: "1.0.0"
  target_duration_sec: 60
  fps: 24
  total_frames: 1440

# Video settings
video:
  resolution: [1280, 720]
  format: mp4
  codec: libx264
  bitrate: "2M"
  pixel_format: yuv420p

# Render settings
render:
  engine: BLENDER_EEVEE
  samples: 64
  workers: 4
  resolution: [1280, 720]
  output_format: PNG

# Audio settings
audio:
  sample_rate: 44100
  channels: 2
  voice_volume: 0.8
  music_volume: 0.3
  sfx_volume: 0.4

# Telegram settings (values come from environment/secrets)
telegram:
  enabled: true
  send_progress: true
  send_assets: true
  send_final_video: true

# Optimization settings
optimization:
  enabled: true
  min_samples: 32
  min_resolution: [960, 540]
  min_fps: 24
  learn_from_history: true
  history_limit: 20

# Failure recovery
failure_recovery:
  max_retries: 3
  retry_delay_sec: 5
  continue_on_partial_failure: true
  validate_before_dependency: true

# Asset limits
assets:
  max_texture_size: 1024
  max_vertices_per_object: 500
  max_total_objects: 50
